name: Windows Premake Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
    - name: Checkout repository + submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    # Cache intermediate build objects (bin-int) generated by premake/MSBuild.
    # Note: MSBuild incremental build relies on file timestamps, and a fresh
    # checkout resets those timestamps — so cache hits may not always avoid
    # recompiling every object, but it still helps for unchanged sub-projects
    # and reduces linker/resource work.
    - name: Cache build intermediates
      uses: actions/cache@v4
      with:
        path: |
          bin-int
        key: ${{ runner.os }}-${{ matrix.configuration }}-build-${{ hashFiles('**/*.lua', '**/premake5.lua', '**/*.h', '**/*.hpp', '**/*.cpp', '**/*.c') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.configuration }}-build-

    - name: Run premake batch script
      shell: cmd
      run: |
        cd scripts/setup
        setup_windows.bat

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1

    - name: Build ${{ matrix.configuration }} x64
      run: >
        msbuild /p:Configuration=${{ matrix.configuration }}
        /p:Platform=x64
        /p:WindowsTargetPlatformVersion=10.0
        /m
        /nr:false
        Equinox.sln